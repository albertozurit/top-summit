# Configuración del driver OSM de GDAL para el pipeline (OSM_CONFIG_FILE).
# Expone como columnas las etiquetas que usa scripts/classify.py; el resto va a other_tags.

closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism
attribute_name_laundering=no

[points]
osm_id=yes
attributes=name,name:es,name:en,natural,tourism,amenity,mountain_pass,ele
other_tags=no

[lines]
osm_id=yes
attributes=name,name:es,name:en,highway,sac_scale
other_tags=no

[multipolygons]
osm_id=yes
osm_way_id=yes
attributes=name,name:es,name:en,natural,tourism,amenity,ele
other_tags=no

[multilinestrings]
osm_id=yes
attributes=name,name:es,name:en,route,ref,network,osmc:symbol
other_tags=yes

[other_relations]
osm_id=yes
attributes=name,type
other_tags=no
